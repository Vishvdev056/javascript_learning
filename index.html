<style>

 #main{
  padding: 30px 30px;
   width: 100%;
  height: 100%;
 } 
 input{
  display: block;
  width: fit-content;
 }
.card {
    height: auto;
     max-width: 300px;
    text-align: center;
    margin-left: 56px;
    margin-right: 50px;
    padding: 20px 0px;
    background-color: #ffe8e8;
    border-radius: 10px;
    border: solid 1px;
    border-color: #000000;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.card h5{
  margin-top: -14px;
}
.card p {
    font-size: 15px;
    margin-top: -20px;

    margin-left: 10px;
    margin-right: 10px;
}
    #container{
      width: fit-content;
       display: flex;
    flex-direction: column;

    }
 
    .profile{
      width: 60px;
      height: 60px;
      background-color: bisque;
      border-radius: 50%;
      margin-bottom: -4px;
      overflow: hidden;
    }

    .profile img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      
    }

</style>

<div id="main">
  
  <form action="" id="container">
    <input type="text" placeholder="profile Pic">

  </form>

</div>
